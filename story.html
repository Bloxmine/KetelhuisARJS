<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story</title>
    <style>
        body { background-color: #000; margin: 0; overflow: hidden; font-family: sans-serif;}
        /* Optional: Add a subtle hint if the video is waiting for sound */
        #unmute-prompt {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            pointer-events: none;
            font-family: sans-serif;
            transition: opacity 0.5s;
        }
        /* Bottom two-button row: equal-width buttons side-by-side */
        .btn-row {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none; /* allow video clicks outside buttons */
        }
        .btn-wrap {
            width: 92%;
            max-width: 700px;
            display: flex;
            justify-content: center;
            pointer-events: auto;
        }
        .btn {
            min-width: 180px;
            text-decoration: none;
            color: white;
            font-size: 20px;
            background-color: #007BFF;
            padding: 12px 14px;
            border-radius: 8px;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="unmute-prompt">Tap anywhere for sound 🔊</div>

    <!-- Keep muted, don't autoplay, and playsinline for Safari compatibility -->
    <video id="story-video" muted playsinline style="width: 100%; height: 100vh; object-fit: cover;">
        <source src="Ketelhuis.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="btn-row">
        <div class="btn-wrap">
            <a class="btn" id="next-button" href="#">Ga door</a>
        </div>
    </div>

    <script>
        const video = document.getElementById('story-video');
        const prompt = document.getElementById('unmute-prompt');
        const nextButton = document.getElementById('next-button');
        const choice = new URLSearchParams(window.location.search).get('choice');

        nextButton.href = choice === 'interaction' ? 'interaction.html' : 'cabinet.html';

        function enableSound() {
            // Unmute and try to ensure it's playing
            video.muted = false;
            video.play();
            
            // Hide the prompt
            prompt.style.opacity = '0';
            
            // Remove listeners so they don't fire again
            window.removeEventListener('click', enableSound);
            window.removeEventListener('touchstart', enableSound);
        }

        // Listen for the first touch/click to unlock audio
        window.addEventListener('click', enableSound);
        window.addEventListener('touchstart', enableSound);

        // Safari sometimes pauses video if you unmute it without a fresh play() call
        // This ensures the video stays running
        video.addEventListener('volumechange', () => {
            if (!video.muted && video.paused) {
                video.play();
            }
        });
    </script>
</body>
</html>
