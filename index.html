<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketelhuis AR | Steampunk</title>
    <style>
        :root {
            --brass: #b58921;
            --copper: #b87333;
            --iron: #2b2b2b;
            --steam-white: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Garamond', serif;
            /* Dark industrial background with a subtle metallic texture feel */
            background: radial-gradient(circle, #3d3d3d 0%, #1a1a1a 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #e0e0e0;
            overflow: hidden;
        }

        /* Ambient "Steam" effect in background */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(45deg, var(--steam-white) 0%, transparent 10%, var(--steam-white) 20%);
            animation: drift 20s linear infinite;
            pointer-events: none;
            opacity: 0.3;
        }

        @keyframes drift {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(0%, 0%); }
        }

        .main-content {
            position: relative;
            text-align: center;
            z-index: 10;
            padding: 40px;
            border: 4px double var(--brass);
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(181, 137, 33, 0.2);
            border-radius: 10px;
        }

        /* The Logo with a subtle "vibration" as if a machine is running */
        .logo {
            width: 500px;
            max-width: 90vw;
            height: auto;
            filter: drop-shadow(0 0 10px var(--copper));
            animation: machineHum 4s ease-in-out infinite;
        }

        @keyframes machineHum {
            0%, 100% { transform: translateY(0); filter: brightness(1); }
            50% { transform: translateY(-5px); filter: brightness(1.2); }
        }

        .startbutton {
            margin-top: 50px;
            display: flex;
            justify-content: center;
        }

        .choice-buttons {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Steampunk Button Style */
        .btn-steampunk {
            display: inline-block;
            text-decoration: none;
            color: var(--brass);
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            
            padding: 15px 40px;
            border: 3px solid var(--brass);
            background: linear-gradient(to bottom, #444, #222);
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .btn-steampunk:hover {
            color: #fff;
            border-color: var(--copper);
            text-shadow: 0 0 10px var(--copper);
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--brass);
        }

        /* Tiny "Rivet" decorations in the corners of the button */
        .btn-steampunk::before, .btn-steampunk::after {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--brass);
            border-radius: 50%;
            top: 5px;
        }
        .btn-steampunk::before { left: 5px; }
        .btn-steampunk::after { right: 5px; }

    </style>
</head>
<body>

    <div class="main-content">
        <img class="logo" src="images/logo.png" alt="Ketelhuis AR Logo">
        
        <div class="startbutton">
            <div class="choice-buttons">
                <a href="story.html?choice=cabinet" class="btn-steampunk" id="start-cabinet">
                    KAST
                </a>
                <a href="story.html?choice=interaction" class="btn-steampunk" id="start-interaction">
                    VENTIELEN
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('start-cabinet').addEventListener('click', function() {
            console.log("Engine Engaged - Cabinet path selected.");
        });

        document.getElementById('start-interaction').addEventListener('click', function() {
            console.log("Engine Engaged - Interaction path selected.");
        });
    </script>
</body>
</html>
